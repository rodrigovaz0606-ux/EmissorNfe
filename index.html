<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistemas Vaz · Emissor NF-e</title>
    <meta name="application-name" content="Sistemas Vaz" />
    <meta name="apple-mobile-web-app-title" content="Sistemas Vaz" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Antes do primeiro desenho, para o tema escuro não piscar em branco.
      (function () {
        var salvo = null;
        try { salvo = localStorage.getItem('emissor.tema'); } catch (e) { /* sem armazenamento */ }
        var escuro = salvo ? salvo === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
