[package]
name = "emissor-nfe"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23.1"
cbc = "0.1"
chrono = "0.4.45"
des = "0.8"
hmac = "0.12"
native-tls = "0.2.18"
pbkdf2 = "0.12"
pdf-writer = "0.15.0"
rand = "0.8"
rc2 = "0.8"
regex = "1.13.1"
roxmltree = "0.21.2"
rsa = { version = "0.9.10", features = ["sha1"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
x509-parser = "0.18.1"
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5", features = ["util"] }
